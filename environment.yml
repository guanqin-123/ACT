name: act-py312
channels:
  - gurobi
  - conda-forge
  - conda-pypi
  - nodefaults
dependencies:
  - python=3.12
  - onnx
  - onnxruntime
  - onnx2torch
  - onnxconverter-common
  - onnxscript
  - pandas
  - numpy
  - networkx
  - tqdm
  - gurobi
  - ipykernel
  - ipywidgets  # Interactive trace explorer in Jupyter notebooks
  - matplotlib>=3.9
  - pyyaml  # Config loading (specs, models)
  - psutil  # Memory monitoring in pipeline
  - pytorch-gpu>=2.8
  - torchvision>=0.23
  # ML frameworks (pipeline/llm_probe.py)
  - transformers
  - scikit-learn
  - pip
  - pip:
      # ONNX ecosystem - for VNNLib benchmarks
      - onnxsim==0.6.5
