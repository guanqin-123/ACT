# ACT Back-End Configuration
#
# Canonical source for ALL back-end settings (runtime, verification, generation).
# CI (.github/workflows/act-bab.yml) relies on these defaults.
#
# Precedence:  CLI flag  >  environment variable  >  this file  >  code default
# Env vars:    ACT_SOLVER / ACT_DEVICE / ACT_DTYPE

backend:

  # ── Verification Runtime (global) ────────────────────────────────────────────────────

  # Solver backend for LP/MILP verification.
  #   "auto"   – try Gurobi first, fall back to TorchLP
  #   "gurobi" – exact MILP/LP via Gurobi (requires license)
  #   "torch"  – PyTorch-based LP relaxation (GPU-capable, no license)
  solver: "torch"

  # Compute device.
  #   "cpu"  – run on CPU (CI default, always available)
  #   "cuda" – run on NVIDIA GPU (requires CUDA toolkit)
  #   "gpu"  – alias for "cuda"
  device: "cpu"

  # Floating-point precision for all tensors.
  #   "float64" – double precision (more accurate, slower)
  #   "float32" – single precision (faster, may cause numerical drift)
  dtype: "float64"

  # Representation for Conv A/b matrices in dual verification.
  #   "matrix"  – dense LinearBound (current default, baseline)
  #   "patches" – sparse auto_LiRPA-style Patches (memory-efficient; enabled in W3)
  conv_mode: "patches"

  # Print extra diagnostic output across all commands.
  verbose: false

  # ── BaBVerification ────────────────────────────────────────────────────────

  # Wall-clock budget in seconds for verification.
  # Single source of truth for BOTH verify_once and verify_bab.
  # (CLI wires this into verify_bab's time_budget_s parameter.)
  timeout: 60.0

  bab:
    # Enable Branch-and-Bound refinement (true) or single execution (false).
    enabled: true

    # Maximum depth of the BaB search tree.
    max_depth: 3

    # Maximum number of subproblems (nodes) to explore.
    #   null – no node cap (stop on time_budget_s or pool exhaustion)
    max_nodes: 10

    # How to pick the next input dimension / neuron to split.
    #   "random" – uniform random selection (baseline)
    branching_method: "random"

    # How to order subproblems in the work pool.
    #   "random" – random ordering (baseline)
    #   "bfs"    – breadth-first (FIFO)
    #   "dfs"    – depth-first (LIFO)
    bounding_method: "random"

    # Number of subproblems evaluated together in each forward/backward batch.
    # Tune to GPU memory; larger = better throughput, more memory.
    subproblem_batch_size: 64

    # Number of Adam iterations for η (eta) per BaB node.
    # Higher = tighter bounds but more compute per node.
    eta_iters: 20

    # Tier 3 — pre-BaB α-CROWN intermediate-bound tightening (default OFF).
    # When True, runs an Adam loop before BaB starts that, for every
    # pre-activation layer L, optimizes α at upstream ReLUs to tighten
    # [lb_L, ub_L]. The tightened bounds replace bounds_dict for the rest
    # of the run. See docs/tier3.md for the math.
    alpha_split_objective: false

    # Number of Adam iters for the pre-BaB α-intermediate loop.
    # Ignored when alpha_split_objective=false.
    alpha_iters: 10

    # Adam learning rate for α (intermediate + final). Matches α-β-CROWN.
    lr_alpha: 0.5

    # Learning rate for the η (eta) Adam optimizer.
    lr_eta: 0.05

    # Weight for the BaB-time intermediate-bound tightening term.
    # 0.0 reproduces Fix-1-only behaviour.
    lambda_intermediate: 1.0

    # Minimum pre-activation bound gap (|ub - lb|) required before a smooth
    # activation is considered splittable. Smaller = more aggressive splitting.
    smooth_split_min_gap: 0.01

    # Maximum number of times a single neuron may be split along any path.
    max_splits_per_neuron: 4

    # Chunk size for batching specs within a subproblem.
    #   null – no chunking (process all specs together)
    spec_chunk_size: null

    # Record per-subproblem α/η Adam trajectories for diagnostics (BoundTrace).
    # Disable in production for performance.
    record_bound_trace: false

    # Emit verbose per-node BaB progress logging.
    verbose: false

  # ── Network Generation (net_factory) ────────────────────────────────────
  # Controls how many networks to generate, where, and TF filtering.
  # Architecture sampling DSL (family definitions, input/output specs)
  # lives in gen_config_path — a separate file with its own schema.

  generation:
    # Path to the architecture sampling config (families, specs, etc.).
    gen_config_path: "act/back_end/examples/config_gen_act_net.yaml"

    # Directory where generated .json network files are written.
    output_dir: "act/back_end/examples/nets"

    # Number of networks to generate per run.
    num_instances: 15

    # Random seed for reproducible generation.
    base_seed: 42

    # Prefix prepended to every generated filename.
    name_prefix: "cfg_seed"

    # Transfer-function targets for layer filtering.
    #   null            – no filtering, all layer types allowed
    #   ["interval"]    – only layers supported by interval TF
    #   ["interval", "hybridz"] – layers supported by both TFs
    tf_targets: null

    # How to combine layer sets when multiple tf_targets are given.
    #   "intersection" – keep only layers supported by ALL targets (stricter)
    #   "union"        – keep layers supported by ANY target (more permissive)
    registry_mode: "intersection"

    # When to stop generating.
    #   "basic" – generate exactly num_instances, then stop
    #   "full"  – keep generating until every target layer type is covered
    coverage_mode: "basic"

    # Maximum attempts in "full" coverage mode before giving up.
    coverage_max_attempts: 1000

    # Print a layer-coverage summary after generation finishes.
    coverage_report: true

    # Write a manifest.json listing all generated network filenames.
    write_manifest: true
